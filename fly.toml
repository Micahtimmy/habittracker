# fly.toml app configuration file generated for StreakKeeper
app = "habittracker-7atdcg"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/streakkeeper.db"
  NODE_ENV = "production"
  PORT = "5000"

[[mounts]]
  source = "streakkeeper_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
